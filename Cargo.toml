[package]
name = "pebble_64cores"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]
test = false
doctest = false
bench = false

[dependencies]
pebble-sdk = { git = "https://codeberg.org/pebble-rust/pebble-sdk.git", rev = "196d8bd999210d3de8baee55a557a99aca6e25f9" }

[profile.release]
panic = "abort"
opt-level = 2
lto = "fat"

[profile.dev]
panic = "abort"
