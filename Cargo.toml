[package]
name = "pebble_64cores"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]
test = false
doctest = false
bench = false

[dependencies]
pebble-sdk = { git = "https://codeberg.org/pebble-rust/pebble-sdk.git", rev = "31e9e9e89a1f1d9269a4d41f32643f83418c677a" }

[profile.release]
panic = "abort"
opt-level = 2

[profile.dev]
panic = "abort"
