[package]
name = "pebble_64cores"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]
test = false
doctest = false
bench = false

[dependencies]
pebble-sdk = { git = "https://codeberg.org/pebble-rust/pebble-sdk.git", rev = "62344fcdaece8a0cd845362c1f5ab64f4c63cb87" }

[profile.release]
panic = "abort"
opt-level = 2

[profile.dev]
panic = "abort"
